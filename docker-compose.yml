services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    image: la-panca-app
    ports:
      - "3100:3000"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # Modo mantenimiento y bloqueo de IPs (src/proxy.ts). Para prenderlos
      # en producción: setear en el .env del host y `docker compose up -d`
      # (recrea el contenedor, no basta con reiniciarlo).
      MANTENIMIENTO: ${MANTENIMIENTO:-false}
      IPS_BLOQUEADAS: ${IPS_BLOQUEADAS:-}
    networks:
      - default
      - supabase

networks:
  # Supabase local (CLI-managed via `supabase start`) publishes its own
  # network named `supabase_network_<project_id>` — project_id comes from
  # supabase/config.toml ("la-panaderia"). Joining it lets this container
  # reach Kong by its service name instead of a host-published port,
  # which only works from the host machine, not from inside another
  # container. Run `supabase start` before `docker compose up`.
  supabase:
    name: supabase_network_la-panaderia
    external: true
