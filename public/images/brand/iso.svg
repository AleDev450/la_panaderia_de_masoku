<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="CACHUDOBET">
  <title>CACHUDOBET</title>
  <!--
    Isotipo: cabeza con cachos + rayo amarillo detrás, a la izquierda.

    Los cachos salen de las sienes y barren hacia AFUERA antes que hacia
    arriba (tips en x=20 y x=180, a la altura de la frente). Las dos
    versiones anteriores los tenían casi verticales y leían como orejas de
    conejo: en un cacho lo que manda es la apertura horizontal.

    Ojos y hocico se recortan con máscara y no con fill-rule: los cachos se
    solapan con la cara y con evenodd abrirían huecos donde no van.
  -->
  <defs>
    <mask id="cachudo-cortes">
      <rect width="200" height="200" fill="#fff" />
      <path d="M76 94 L96 101 L94 112 L74 105 Z" fill="#000" />
      <path d="M124 94 L104 101 L106 112 L126 105 Z" fill="#000" />
      <path d="M90 126 L110 126 L100 148 Z" fill="#000" />
    </mask>
  </defs>

  <!-- Rayo amarillo: va primero, así queda DETRÁS del cacho izquierdo y
       asoma por fuera, como en el arte de marca. -->
  <path d="M40 4 L6 78 L28 73 L14 154 L58 62 L36 68 Z" fill="#f5c518" />

  <g mask="url(#cachudo-cortes)">
    <!-- Cachos -->
    <path d="M68 82 C50 76 30 60 20 30 C44 44 66 58 84 70 Z" fill="#fff" />
    <path d="M132 82 C150 76 170 60 180 30 C156 44 134 58 116 70 Z" fill="#fff" />
    <!-- Cara -->
    <path d="M68 72 L132 72 L126 112 L114 146 L100 172 L86 146 L74 112 Z" fill="#fff" />
  </g>
</svg>
